<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 Nhạc của minhvukgh1979</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>🎵 Nhạc của minhvukgh1979</h1>
    <div class="topbar-actions">
      <input id="searchInput" type="text" placeholder="Tìm bài hát..." />
      <button id="reloadBtn" title="Tải lại danh sách">↻</button>
    </div>
  </header>

  <div id="statusMsg" class="status-msg">Đang tải danh sách nhạc...</div>

  <main id="trackList" class="track-list"></main>

  <footer id="player" class="player hidden">
    <div class="player-info">
      <div id="nowTitle" class="now-title">—</div>
      <div class="seek-row">
        <span id="timeCurrent" class="time">0:00</span>
        <input id="seekBar" type="range" min="0" max="1000" value="0" step="0.1" />
        <span id="timeDuration" class="time">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button id="shuffleBtn" class="icon-btn" title="Phát ngẫu nhiên">🔀</button>
      <button id="prevBtn" class="icon-btn" title="Bài trước">⏮</button>
      <button id="playPauseBtn" class="icon-btn play-btn" title="Phát/Tạm dừng (Space)">▶</button>
      <button id="nextBtn" class="icon-btn" title="Bài sau">⏭</button>
      <button id="repeatBtn" class="icon-btn" title="Lặp lại">🔁</button>
      <div class="volume-wrap">
        <button id="muteBtn" class="icon-btn" title="Tắt/Bật tiếng">🔊</button>
        <input id="volumeBar" type="range" min="0" max="1" value="1" step="0.05" />
      </div>
    </div>
  </footer>

  <audio id="audioEl" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
